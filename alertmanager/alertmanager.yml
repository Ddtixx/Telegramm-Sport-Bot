global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: '${ALERTMANAGER_BOT_TOKEN}'
        chat_id: '${ALERTMANAGER_CHAT_ID}'
        parse_mode: 'HTML'
        message: |
          🚨 <b>{{ .Status | toUpper }}</b>

          {{ range .Alerts }}
          <b>Alert:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          <b>Severity:</b> {{ .Labels.severity }}
          {{ end }}
